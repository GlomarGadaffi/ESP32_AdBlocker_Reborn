name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through the private advisory form, not here.
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - LilyGO T-ETH-Elite
        - Waveshare ESP32-S3-ETH
        - Generic ESP32-S3 (Wi-Fi only)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: Shown on the dashboard, or in the first serial log lines.
      placeholder: "1.5.0"
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Upstream mode
      options:
        - Plain UDP
        - DNS-over-TLS (DoT)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: /metrics output
      description: Paste the JSON from GET /metrics (log in first).
      render: json
  - type: textarea
    id: serial
    attributes:
      label: Serial log
      description: USB console output covering the problem, 115200 baud. Remove Wi-Fi passwords and the setup passphrase.
      render: text
