name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  host-tests:
    name: Host Tests & Fuzz Replay
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang zip

      - name: Run Host Unit Tests (ASan + UBSan)
        run: sh tests/run_host_tests.sh

      - name: Build & Run Standalone Fuzz Replay (ASan + UBSan)
        run: |
          FUZZ_STANDALONE=1 sh tests/fuzz/build.sh
          ./tests/fuzz/out/fuzz_dns_wire tests/fuzz/corpus/dns_wire
          ./tests/fuzz/out/fuzz_rule_parse tests/fuzz/corpus/rule_parse
          ./tests/fuzz/out/fuzz_web_parse tests/fuzz/corpus/web_parse
          ./tests/fuzz/out/fuzz_metrics_prom tests/fuzz/corpus/metrics_prom

      - name: libFuzzer smoke (60 s per target)
        run: |
          mkdir -p tests/fuzz/crashes tests/fuzz/work
          CC=clang sh tests/fuzz/build.sh
          for spec in dns_wire:1500 rule_parse:512 web_parse:512 metrics_prom:4096; do
            t=${spec%%:*}; len=${spec##*:}
            # Work on a copy so new finds never touch the tracked corpus.
            cp -r tests/fuzz/corpus/$t tests/fuzz/work/$t
            ./tests/fuzz/out/fuzz_$t tests/fuzz/work/$t -max_len=$len -max_total_time=60 -artifact_prefix=tests/fuzz/crashes/
          done

      - name: Upload fuzz crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          retention-days: 14
          if-no-files-found: ignore
          path: tests/fuzz/crashes/

  build-firmware:
    name: Build Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: t-eth-elite
            build_dir: build
            sdkconfig: sdkconfig
            sdkconfig_defaults: sdkconfig.defaults
          - board: waveshare-s3-eth
            build_dir: build-waveshare
            sdkconfig: sdkconfig.waveshare
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.board.waveshare-s3-eth
          - board: generic-s3-wifi
            build_dir: build-wifi
            sdkconfig: sdkconfig.wifi
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.board.generic-s3-wifi
    container:
      image: espressif/idf:release-v6.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate CI Signing Key if missing
        run: |
          . /opt/esp/entrypoint.sh
          if [ ! -f secure_boot_signing_key.pem ]; then
            echo "Generating ephemeral RSA-3072 signing key for CI build..."
            espsecure.py generate_signing_key --version 2 --scheme rsa3072 secure_boot_signing_key.pem
          fi

      - name: Build Firmware (${{ matrix.board }})
        run: |
          . /opt/esp/entrypoint.sh
          # Every supported board is ESP32-S3. The board overlays set the target,
          # but plain sdkconfig.defaults (t-eth-elite) does not, and IDF would
          # otherwise default to esp32 — whose ECDSA-only signing then chokes on
          # the RSA-3072 key.
          idf.py -B ${{ matrix.build_dir }} \
            -DIDF_TARGET=esp32s3 \
            -DSDKCONFIG=${{ matrix.sdkconfig }} \
            "-DSDKCONFIG_DEFAULTS=${{ matrix.sdkconfig_defaults }}" \
            build

      - name: Verify Build Artifacts
        run: |
          test -f ${{ matrix.build_dir }}/dns-sink.bin
          test -s ${{ matrix.build_dir }}/dns-sink.bin
          ls -lh ${{ matrix.build_dir }}/dns-sink.bin

      - name: Check build (size headroom + sdkconfig invariants)
        run: python3 tools/check_build.py --build-dir ${{ matrix.build_dir }} --board ${{ matrix.board }}

      # Signed with the throwaway key generated above, not the release key. A
      # board serial-flashed with this image only accepts OTA images signed by
      # that same (discarded) key, so it can never take an official release
      # over the air again — hence the name, and the short retention.
      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-${{ matrix.board }}-throwaway-key-do-not-flash
          retention-days: 7
          path: |
            ${{ matrix.build_dir }}/dns-sink.bin
            ${{ matrix.build_dir }}/bootloader/bootloader.bin
            ${{ matrix.build_dir }}/partition_table/partition-table.bin
            ${{ matrix.build_dir }}/flash_args
